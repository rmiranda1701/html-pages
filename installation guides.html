<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation Guides - Hivelocity</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 70px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%, #0a0a0a 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(60, 60, 60, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(80, 80, 80, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .header-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(100, 100, 100, 0.3);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            flex-wrap: wrap;
        }
        
        .header-menu a {
            padding: 0.6rem 1rem;
            background: linear-gradient(135deg, rgba(80, 80, 80, 0.2), rgba(60, 60, 60, 0.15));
            color: #c0c0c0;
            text-decoration: none;
            border: 1px solid rgba(100, 100, 100, 0.3);
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        
        .header-menu a:hover {
            background: linear-gradient(135deg, rgba(100, 100, 100, 0.3), rgba(80, 80, 80, 0.25));
            border-color: rgba(120, 120, 120, 0.5);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(80, 80, 80, 0.3);
        }

        code {
            font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        }

        /* Custom Tailwind overrides */
        .bg-gray-50 {
            background: transparent !important;
        }

        .bg-white {
            background: linear-gradient(145deg, #1f1f1f 0%, #2a2a2a 100%) !important;
            border: 1px solid rgba(100, 100, 100, 0.2) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
        }

        .bg-gray-200 {
            background: linear-gradient(135deg, #2a2a2a 0%, #353535 100%) !important;
        }

        .border-gray-200 {
            border-color: rgba(100, 100, 100, 0.3) !important;
        }

        .text-black {
            color: #ffffff !important;
            background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-gray-600 {
            color: #b0b0b0 !important;
        }

        .text-gray-500 {
            color: #909090 !important;
        }

        .text-gray-700 {
            color: #c0c0c0 !important;
        }

        .text-gray-800 {
            color: #e0e0e0 !important;
        }

        .text-gray-400 {
            color: #808080 !important;
        }

        .bg-black {
            background: linear-gradient(135deg, #c9a430 0%, #b89620 100%) !important;
            box-shadow: 0 4px 16px rgba(201, 164, 48, 0.3) !important;
        }

        .bg-black:hover {
            background: linear-gradient(135deg, #d4ae3a 0%, #c2a025 100%) !important;
            box-shadow: 0 6px 20px rgba(201, 164, 48, 0.4) !important;
        }

        .bg-gray-100 {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%) !important;
        }

        .bg-gray-800 {
            background: linear-gradient(135deg, #d4ae3a 0%, #c2a025 100%) !important;
        }

        .bg-gray-50 {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%) !important;
        }

        .border-black {
            border-color: rgba(201, 164, 48, 0.5) !important;
        }

        .focus\:border-black:focus {
            border-color: #c9a430 !important;
            box-shadow: 0 0 0 3px rgba(201, 164, 48, 0.15) !important;
        }

        input {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%) !important;
            color: #e0e0e0 !important;
            border: 1px solid rgba(100, 100, 100, 0.3) !important;
        }

        input::placeholder {
            color: #707070 !important;
        }

        input:focus {
            background: linear-gradient(135deg, #141414 0%, #1f1f1f 100%) !important;
        }

        textarea {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%) !important;
            color: #e0e0e0 !important;
            border: 1px solid rgba(100, 100, 100, 0.3) !important;
        }

        textarea::placeholder {
            color: #707070 !important;
        }

        textarea:focus {
            background: linear-gradient(135deg, #141414 0%, #1f1f1f 100%) !important;
            border-color: #c9a430 !important;
            box-shadow: 0 0 0 3px rgba(201, 164, 48, 0.15) !important;
        }

        button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        .hover\:bg-gray-100:hover {
            background: linear-gradient(135deg, #252525 0%, #303030 100%) !important;
        }

        .hover\:text-black:hover {
            color: #c9a430 !important;
        }

        .hover\:bg-gray-300:hover {
            background: linear-gradient(135deg, #353535 0%, #404040 100%) !important;
        }

        /* Category badge styling */
        .bg-gray-200.text-gray-700 {
            background: linear-gradient(135deg, rgba(201, 164, 48, 0.2), rgba(184, 150, 32, 0.15)) !important;
            color: #d4ae3a !important;
            border: 1px solid rgba(201, 164, 48, 0.3);
        }

        /* Code block styling */
        pre {
            background: linear-gradient(135deg, #0a0a0a 0%, #141414 100%) !important;
            border: 1px solid rgba(100, 100, 100, 0.3) !important;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3) !important;
        }

        pre code {
            color: #d4ae3a !important;
            font-weight: 500;
        }

        /* Card hover effects */
        .hover\:shadow-lg:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6) !important;
            transform: translateY(-4px) !important;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f0f;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3a3a3a 0%, #4a4a4a 100%);
            border-radius: 10px;
            border: 2px solid #0f0f0f;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #4a4a4a 0%, #5a5a5a 100%);
        }

        @media (max-width: 768px) {
            body {
                padding-top: 120px;
            }

            .header-menu a {
                flex: 1 1 calc(50% - 0.25rem);
                min-width: 120px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="header-menu">
        <a href="https://app.rei-deploy.store/network_configuration_generator.html" target="_blank">Network Config Generator</a>
        <a href="https://app.rei-deploy.store/ipmitool_script_generator.html" target="_blank">IPMITool Script Generator</a>
        <a href="https://app.rei-deploy.store/Juniper_Wildcard_Command_Generator.html" target="_blank">Juniper Wildcard Generator</a>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide React icons as inline SVG components
        const Search = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
        );

        const ChevronRight = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const Copy = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        );

        const Check = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );

        const Plus = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const InstallationGuidesApp = () => {
            const [selectedGuide, setSelectedGuide] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [copiedCommand, setCopiedCommand] = useState(null);
            const [showSuggestionForm, setShowSuggestionForm] = useState(false);

            const guides = [
                // ========================================
                // cpanel-install
                // ========================================
                {
                    id: 'cpanel-install',
                    title: 'cPanel Installation',
                    description: 'Fresh cPanel & WHM installation on a clean server',
                    category: 'Control Panels',
                    steps: [
                        {
                            title: 'Download and run cPanel installer',
                            commands: [
                                'cd /home',
                                'curl -o latest -L https://securedownloads.cpanel.net/latest',
                                'sh latest'
                            ],
                            description: 'Download the official cPanel installation script and execute it. This process typically takes 30-60 minutes.'
                        },
                        {
                            title: 'Access WHM',
                            description: 'Once installation completes, access WHM to complete setup',
                            commands: [
                                'https://your-server-ip:2087'
                            ]
                        }
                    ]
                },
                // ========================================
                // cpanel-managed-new
                // ========================================
                {
                    id: 'cpanel-managed-new',
                    title: 'cPanel Managed Services (New)',
                    description: 'Add managed services to a NEW cPanel installation',
                    category: 'Managed Services',
                    steps: [
                        {
                            title: 'Download and prepare the script',
                            commands: [
                                'wget scripts.hivelocity.net/harden/managed3.0_install.sh',
                                'chmod +x managed3.0_install.sh'
                            ],
                            description: 'Download the managed services installation script and make it executable'
                        },
                        {
                            title: 'Install managed services for cPanel',
                            commands: ['./managed3.0_install.sh -t cpanel'],
                            description: 'Installs managed services plus /scripts/upcp + csf. Use this for NEW cPanel servers.'
                        }
                    ]
                },
                // ========================================
                // debian-11-to-proxmox-9
                // ========================================
                {
                    id: 'cpanel-managed-existing',
                    title: 'cPanel Managed Services (Existing)',
                    description: 'Add managed services to an EXISTING cPanel server',
                    category: 'Managed Services',
                    steps: [
                        {
                            title: 'Download and prepare the script',
                            commands: [
                                'wget scripts.hivelocity.net/harden/managed3.0_install.sh',
                                'chmod +x managed3.0_install.sh'
                            ],
                            description: 'Download the managed services installation script and make it executable'
                        },
                        {
                            title: 'Install lite managed services',
                            commands: ['./managed3.0_install.sh -t lite'],
                            description: 'Installs just managed services for existing cPanel installations that are becoming managed.'
                        }
                    ]
                },
                // ========================================
                // linux-managed
                // ========================================
                {
                    id: 'linux-managed',
                    title: 'Linux Managed Services',
                    description: 'Add managed services to a Linux server',
                    category: 'Managed Services',
                    steps: [
                        {
                            title: 'Download and prepare the script',
                            commands: [
                                'wget scripts.hivelocity.net/harden/managed3.0_install.sh',
                                'chmod +x managed3.0_install.sh'
                            ],
                            description: 'Download the managed services installation script and make it executable'
                        },
                        {
                            title: 'Install managed services for Linux',
                            commands: ['./managed3.0_install.sh -t linux'],
                            description: 'Installs managed services + csf for standard Linux servers.'
                        }
                    ]
                },
                // ========================================
                // debian-11-to-proxmox-8
                // ========================================
                {
                    id: 'debian-11-to-proxmox-8',
                    title: 'Debian 11 to Proxmox 8',
                    description: 'Convert Debian 11 to Proxmox VE 8',
                    category: 'Virtualization',
                    steps: [
                        {
                            title: 'Add Proxmox repository',
                            commands: [
                                'echo "deb [arch=amd64] http://download.proxmox.com/debian/pve bullseye pve-no-subscription" > /etc/apt/sources.list.d/pve-install-repo.list',
                                'wget https://enterprise.proxmox.com/debian/proxmox-release-bullseye.gpg -O /etc/apt/trusted.gpg.d/proxmox-release-bullseye.gpg',
                                'apt update && apt full-upgrade'
                            ],
                            description: 'Add the Proxmox VE repository to your Debian system'
                        },
                        {
                            title: 'Install Proxmox VE',
                            commands: [
                                'apt install proxmox-ve postfix open-iscsi chrony'
                            ],
                            description: 'Install Proxmox VE and required packages'
                        },
                        {
                            title: 'Reboot and verify',
                            commands: [
                                'systemctl reboot',
                                'pveversion'
                            ],
                            description: 'Reboot the system and verify Proxmox installation'
                        }
                    ]
                },
                // ========================================
                // debian-12-to-proxmox-9
                // ========================================
                {
                    id: 'debian-12-to-proxmox-9',
                    title: 'Debian 12 to Proxmox 9',
                    description: 'Convert Debian 12 to Proxmox VE 9',
                    category: 'Virtualization',
                    steps: [
                        {
                            title: 'Add Proxmox repository',
                            commands: [
                                'echo "deb [arch=amd64] http://download.proxmox.com/debian/pve bookworm pve-no-subscription" > /etc/apt/sources.list.d/pve-install-repo.list',
                                'wget https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg -O /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg',
                                'apt update && apt full-upgrade'
                            ],
                            description: 'Add the Proxmox VE repository to your Debian system'
                        },
                        {
                            title: 'Install Proxmox VE',
                            commands: [
                                'apt install proxmox-ve postfix open-iscsi chrony'
                            ],
                            description: 'Install Proxmox VE and required packages'
                        },
                        {
                            title: 'Reboot and verify',
                            commands: [
                                'systemctl reboot',
                                'pveversion'
                            ],
                            description: 'Reboot the system and verify Proxmox installation'
                        }
                    ]
                }
            ];

            const filteredGuides = guides.filter(guide =>
                guide.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                guide.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                guide.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const copyToClipboard = async (text, id) => {
                try {
                    await navigator.clipboard.writeText(text);
                    setCopiedCommand(id);
                    setTimeout(() => setCopiedCommand(null), 2000);
                } catch (err) {
                    console.error('Failed to copy:', err);
                }
            };

            const CommandBlock = ({ command, id }) => (
                <div className="relative group">
                    <pre className="bg-gray-100 border-2 border-gray-200 rounded-lg p-4 pr-14 overflow-x-auto">
                        <code className="text-sm">{command}</code>
                    </pre>
                    <button
                        onClick={() => copyToClipboard(command, id)}
                        className="absolute top-3 right-3 p-2 bg-gray-200 hover:bg-gray-300 rounded-md transition-colors"
                        title="Copy to clipboard"
                    >
                        {copiedCommand === id ? (
                            <Check size={16} className="text-green-600" />
                        ) : (
                            <Copy size={16} className="text-gray-600" />
                        )}
                    </button>
                </div>
            );

            const GuideCard = ({ guide }) => (
                <div
                    onClick={() => setSelectedGuide(guide)}
                    className="bg-white border-2 border-gray-200 rounded-lg p-6 cursor-pointer hover:shadow-lg transition-all"
                >
                    <div className="flex items-start justify-between mb-3">
                        <span className="inline-block bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full">
                            {guide.category}
                        </span>
                        <ChevronRight size={20} className="text-gray-400" />
                    </div>
                    <h3 className="text-xl font-bold text-black mb-2">{guide.title}</h3>
                    <p className="text-gray-600 text-sm">{guide.description}</p>
                </div>
            );

            const SuggestionForm = () => {
                const [formData, setFormData] = useState({
                    title: '',
                    description: '',
                    email: ''
                });

                const handleSubmit = (e) => {
                    e.preventDefault();
                    const mailtoLink = `mailto:support@hivelocity.net?subject=Installation Guide Suggestion: ${encodeURIComponent(formData.title)}&body=${encodeURIComponent(`Description: ${formData.description}\n\nSubmitted by: ${formData.email}`)}`;
                    window.location.href = mailtoLink;
                    setShowSuggestionForm(false);
                    setFormData({ title: '', description: '', email: '' });
                };

                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                        <div className="bg-white rounded-lg max-w-md w-full p-6">
                            <h2 className="text-2xl font-bold text-black mb-4">
                                Suggest a Guide
                            </h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                                        Guide Title
                                    </label>
                                    <input
                                        type="text"
                                        required
                                        value={formData.title}
                                        onChange={(e) => setFormData({...formData, title: e.target.value})}
                                        className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none"
                                        placeholder="e.g., Docker Installation on Ubuntu 22.04"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                                        Description
                                    </label>
                                    <textarea
                                        required
                                        value={formData.description}
                                        onChange={(e) => setFormData({...formData, description: e.target.value})}
                                        className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none"
                                        rows="4"
                                        placeholder="Describe what this guide should cover..."
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                                        Your Email (optional)
                                    </label>
                                    <input
                                        type="email"
                                        value={formData.email}
                                        onChange={(e) => setFormData({...formData, email: e.target.value})}
                                        className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none"
                                        placeholder="your@email.com"
                                    />
                                </div>
                                <div className="flex gap-3 pt-2">
                                    <button
                                        type="submit"
                                        className="flex-1 bg-black text-white py-3 rounded-md font-semibold hover:bg-gray-800 transition-colors"
                                    >
                                        Submit Suggestion
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowSuggestionForm(false)}
                                        className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-md font-semibold hover:bg-gray-300 transition-colors"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            };

            if (selectedGuide) {
                return (
                    <div className="min-h-screen bg-gray-50">
                        <div className="max-w-4xl mx-auto p-6">
                            <button
                                onClick={() => setSelectedGuide(null)}
                                className="mb-6 text-gray-600 hover:text-black font-medium flex items-center gap-2"
                            >
                                ← Back to all guides
                            </button>

                            <div className="bg-white border-2 border-gray-200 rounded-lg p-8 mb-6">
                                <div className="mb-6">
                                    <span className="inline-block bg-gray-200 text-gray-700 text-sm font-semibold px-3 py-1 rounded-full mb-3">
                                        {selectedGuide.category}
                                    </span>
                                    <h1 className="text-4xl font-bold text-black mb-3">
                                        {selectedGuide.title}
                                    </h1>
                                    <p className="text-lg text-gray-600">{selectedGuide.description}</p>
                                </div>

                                <div className="space-y-8">
                                    {selectedGuide.steps.map((step, stepIndex) => (
                                        <div key={stepIndex} className="border-l-4 border-black pl-6">
                                            <h2 className="text-2xl font-bold text-black mb-3">
                                                Step {stepIndex + 1}: {step.title}
                                            </h2>
                                            {step.description && (
                                                <p className="text-gray-600 mb-4">{step.description}</p>
                                            )}

                                            {step.commands && (
                                                <div className="space-y-2">
                                                    {step.commands.map((cmd, cmdIndex) => (
                                                        <CommandBlock
                                                            key={cmdIndex}
                                                            command={cmd}
                                                            id={`step-${stepIndex}-cmd-${cmdIndex}`}
                                                        />
                                                    ))}
                                                </div>
                                            )}

                                            {step.options && (
                                                <div className="space-y-4 mt-4">
                                                    {step.options.map((option, optIndex) => (
                                                        <div
                                                            key={optIndex}
                                                            className="bg-gray-50 border-2 border-gray-200 rounded-lg p-4"
                                                        >
                                                            <h3 className="font-bold text-black mb-2">
                                                                {option.label}
                                                            </h3>
                                                            <p className="text-sm text-gray-600 mb-3">
                                                                {option.description}
                                                            </p>
                                                            <CommandBlock
                                                                command={option.command}
                                                                id={`step-${stepIndex}-opt-${optIndex}`}
                                                            />
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="max-w-6xl mx-auto p-6">
                        <div className="mb-8">
                            <h1 className="text-5xl font-bold text-black mb-3">
                                Installation Guides
                            </h1>
                            <p className="text-xl text-gray-600">
                                Step-by-step guides for server deployments and configurations
                            </p>
                        </div>

                        <div className="flex gap-4 mb-8">
                            <div className="flex-1 relative">
                                <Search
                                    className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
                                    size={20}
                                />
                                <input
                                    type="text"
                                    placeholder="Search guides..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none text-gray-800"
                                />
                            </div>
                            <button
                                onClick={() => setShowSuggestionForm(true)}
                                className="bg-black text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-800 transition-colors flex items-center gap-2"
                            >
                                <Plus size={20} />
                                Suggest Guide
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredGuides.map((guide) => (
                                <GuideCard key={guide.id} guide={guide} />
                            ))}
                        </div>

                        {filteredGuides.length === 0 && (
                            <div className="text-center py-12">
                                <p className="text-gray-500 text-lg">
                                    No guides found matching your search.
                                </p>
                            </div>
                        )}
                    </div>

                    {showSuggestionForm && <SuggestionForm />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InstallationGuidesApp />);
    </script>
</body>
</html>
